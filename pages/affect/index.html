<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>影响核心</title>
<style>
  :root {
    --fg:#0d0f14; --fg-dim:#2b313c; --fg-muted:#5b6472;
    --card:#ffffff; --card-border:#c7ced9; --panel:#f4f6fa;
    --accent:#0b57d0; --pos:#0b7a3b; --neg:#b3261e; --grid:#d7dde7; --zero:#9aa4b4;
  }
  html[data-theme="dark"] {
    --fg:#f6f8fb; --fg-dim:#dde2ea; --fg-muted:#a9b2c2;
    --card:rgba(255,255,255,0.06); --card-border:rgba(255,255,255,0.24);
    --panel:rgba(255,255,255,0.04); --accent:#6aa2ff; --pos:#45d17f;
    --neg:#ff6b60; --grid:rgba(255,255,255,0.20); --zero:rgba(255,255,255,0.40);
  }
  *{box-sizing:border-box}
  body{margin:0;padding:18px;font-family:ui-sans-serif,system-ui,"Microsoft YaHei",sans-serif;
       font-weight:500;background:transparent;color:var(--fg);-webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px;margin:0 auto}
  h1{font-size:20px;font-weight:800;margin:0 0 4px}
  .sub{font-size:13px;color:var(--fg-muted);margin-bottom:14px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  .chip{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;
        background:var(--panel);border:1px solid var(--card-border);color:var(--fg-dim)}
  .card{background:var(--card);border:1px solid var(--card-border);border-radius:12px;
        padding:14px;margin-bottom:12px}
  .section-title{font-size:12px;font-weight:800;letter-spacing:1px;color:var(--fg-muted);margin:0 0 10px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:820px){.grid2{grid-template-columns:1fr}}
  .big{font-size:30px;font-weight:900;color:var(--accent);margin:0 0 6px}
  .row{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:12.5px}
  .name{width:78px;flex:none;color:var(--fg-dim)}
  .val{width:52px;text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
  .track{position:relative;flex:1;height:13px;background:var(--panel);border:1px solid var(--card-border);
         border-radius:7px;overflow:hidden}
  .fill{position:absolute;top:0;bottom:0;border-radius:6px;background:var(--accent)}
  .fill.pos{background:var(--pos)} .fill.neg{background:var(--neg)}
  .gauge{position:relative;height:14px;border-radius:7px;background:var(--panel);
         border:1px solid var(--card-border);overflow:hidden}
  .gauge i{display:block;height:100%;background:var(--pos);border-radius:6px}
  .meta{font-size:11.5px;color:var(--fg-muted);margin-top:8px;line-height:1.7}
  .people{max-height:260px;overflow:auto}
  .person{display:flex;gap:9px;align-items:center;padding:7px 8px;border-radius:8px;cursor:pointer}
  .person:hover{background:var(--panel)}
  .person.active{background:var(--panel);border:1px solid var(--accent)}
  .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .pname{font-size:12.5px;font-weight:700}
  .pmeta{font-size:11px;color:var(--fg-muted)}
  svg.radar{display:block;width:100%;height:auto}
  .ring{fill:none;stroke:var(--grid);stroke-width:1}
  .ring.zero{stroke:var(--zero);stroke-dasharray:4 3}
  .axis{stroke:var(--grid)}
  .axis-label{fill:var(--fg-muted);font-size:10.5px;font-weight:700}
  .shape{fill:var(--accent);fill-opacity:.22;stroke:var(--accent);stroke-width:2}
  pre{margin:0;white-space:pre-wrap;word-break:break-word;font-size:11.5px;line-height:1.7;
      color:var(--fg-dim);font-family:ui-monospace,Consolas,monospace;max-height:320px;overflow:auto}
  .empty{font-size:13px;color:var(--fg-muted);padding:16px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <h1>影响核心</h1>
  <div class="sub">激素 → 情绪 → 情感 → 能量 · 四层闭环</div>
  <div class="chips" id="chips"></div>

  <div class="grid2">
    <div class="card">
      <div class="section-title">能量</div>
      <div class="big" id="energyVal">…</div>
      <div class="gauge"><i id="energyBar" style="width:0%"></i></div>
      <div class="meta" id="energyMeta"></div>
    </div>
    <div class="card">
      <div class="section-title">心情</div>
      <div class="big" id="emotionVal">…</div>
      <div class="meta" id="styleText"></div>
    </div>
  </div>

  <div class="grid2">
    <div class="card">
      <div class="section-title">八维</div>
      <div id="radar"></div>
    </div>
    <div class="card">
      <div class="section-title">此刻性格</div>
      <div id="traits"></div>
    </div>
  </div>

  <div class="card">
    <div class="section-title">激素（十种）</div>
    <div id="hormones"></div>
  </div>

  <div class="grid2">
    <div class="card">
      <div class="section-title">情感（按人独立）</div>
      <div class="people" id="people"></div>
    </div>
    <div class="card">
      <div class="section-title">选中的人</div>
      <div id="detail"><div class="empty">…</div></div>
    </div>
  </div>

  <div class="card">
    <div class="section-title">当前注入的卡片</div>
    <pre id="cardText">…</pre>
  </div>
</div>

<script>
const DIM_LABELS={valence:"愉悦",arousal:"唤醒",dominance:"掌控",affiliation:"亲近",certainty:"确定",tension:"紧张",fatigue:"疲惫",immersion:"沉浸"};
const TRAIT_LABELS={lively:"活泼",gentle:"温柔",clingy:"黏人",sharp:"毒舌",patient:"耐心",proactive:"主动",humor:"幽默",coquettish:"撒娇",assertive:"强势",considerate:"体贴",rational:"理性",sensitive:"敏感",cold:"冷漠",grumpy:"暴躁",pessimistic:"悲观",suspicious:"多疑",lazy:"懒散",perfunctory:"敷衍"};
let DATA={}, SELECTED="", refreshTimer=null, REFRESH_MIN=5;

const bridge=()=>window.AstrBotPluginView||window.AstrBotPluginPage;
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
async function fetchData(){
  const b=bridge();
  if(b){try{await b.ready();return await b.apiGet("page/data");}catch(e){console.warn(e);}}
  const r=await fetch("./data.json?t="+Date.now(),{cache:"no-store"});
  if(!r.ok)throw new Error("data.json HTTP "+r.status);
  return await r.json();
}
function bar(label,value,signed){
  let fill,cls="";
  if(signed){const w=Math.min(50,Math.abs(value)*50);fill=value>=0?`left:50%;width:${w}%`:`right:50%;width:${w}%`;cls=value>=0?"pos":"neg";}
  else{fill=`left:0;width:${Math.max(0,Math.min(100,value*100))}%`;cls="pos";}
  const txt=signed?(value>=0?"+":"")+value.toFixed(2):value.toFixed(2);
  return `<div class="row"><span class="name">${label}</span><span class="track"><i class="fill ${cls}" style="${fill}"></i></span><span class="val">${txt}</span></div>`;
}
function radar(dims){
  const keys=Object.keys(DIM_LABELS),cx=160,cy=150,R=100,n=keys.length;
  const ang=i=>-Math.PI/2+i*2*Math.PI/n, pt=(i,r)=>[cx+Math.cos(ang(i))*r,cy+Math.sin(ang(i))*r];
  let rings="";[0.25,0.5,0.75,1].forEach(t=>{const p=keys.map((_,i)=>pt(i,R*t).map(v=>v.toFixed(1)).join(",")).join(" ");
    rings+=`<polygon class="ring${t===0.5?" zero":""}" points="${p}"/>`;});
  let axes="",labels="";
  keys.forEach((k,i)=>{const [x,y]=pt(i,R);axes+=`<line class="axis" x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>`;
    const [lx,ly]=pt(i,R+22);labels+=`<text class="axis-label" x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" dominant-baseline="middle">${DIM_LABELS[k]}</text>`;});
  const pts=keys.map((k,i)=>{const v=Math.max(-1,Math.min(1,Number(dims[k]||0)));return pt(i,(v+1)/2*R).map(x=>x.toFixed(1)).join(",");}).join(" ");
  return `<svg class="radar" viewBox="0 0 320 290">${rings}${axes}<polygon class="shape" points="${pts}"/>${labels}</svg>`;
}
function renderChips(){
  const m=DATA.meta||{}, e=DATA.energy||{}, mood=DATA.mood||{};
  const items=[`心情 ${mood.emotion||"?"}`,`能量 ${Math.round(e.effective||0)}%（${e.tier||""}）`,
               `情感 ${(DATA.people||[]).length} 人`,`模型 ${m.model||"?"}`];
  document.getElementById("chips").innerHTML=items.map(t=>`<span class="chip">${esc(t)}</span>`).join("");
}
function render(){
  const mood=DATA.mood||{}, energy=DATA.energy||{}, dims=mood.dims||{};
  document.getElementById("emotionVal").textContent=mood.emotion||"—";
  const eff=Number(energy.effective||0);
  document.getElementById("energyVal").textContent=Math.round(eff)+"%";
  document.getElementById("energyBar").style.width=Math.max(0,Math.min(100,eff))+"%";
  document.getElementById("energyBar").style.background=eff<20?"var(--neg)":eff<40?"#c98a00":"var(--pos)";
  document.getElementById("energyMeta").innerHTML=
    `昼夜基础 ${Number(energy.base||0).toFixed(0)}%　·　激素/情绪/负荷 ${Number(energy.bias||0)>=0?"+":""}${Number(energy.bias||0).toFixed(1)}%
     <br>接话率 ${Math.round(Number(energy.rate||0)*100)}%　·　${esc(energy.tier||"")}`
    + (Number(energy.sleep_debt||0) > 0 ? `　·　睡眠债 ${Number(energy.sleep_debt).toFixed(1)}%` : "");
  document.getElementById("styleText").textContent=(mood.style||[]).join("；");
  document.getElementById("radar").innerHTML=radar(dims);
  const tr=mood.traits||{}, tl=mood.trait_labels||TRAIT_LABELS;
  document.getElementById("traits").innerHTML=Object.keys(tl).map(k=>bar(tl[k],Number(tr[k]||0),false)).join("");
  const h=mood.hormones||{}, hl=mood.hormone_labels||{};
  document.getElementById("hormones").innerHTML=Object.keys(hl).map(k=>bar(hl[k],Number(h[k]||0),false)).join("");
  const card=DATA.card||{};
  document.getElementById("cardText").textContent=card.text||"还没有注入过。";
  renderPeople(); renderDetail(); renderChips();
}
function renderPeople(){
  const box=document.getElementById("people"), people=DATA.people||[];
  if(!people.length){box.innerHTML=`<div class="empty">还没有情感画像</div>`;return;}
  if(!people.find(p=>p.qq===SELECTED))SELECTED=people[0].qq;
  box.innerHTML=people.map(p=>{
    const s=p.sentiment||{}, v=Number(s.score||0);
    const color=v>0.15?"var(--pos)":v<-0.15?"var(--neg)":"var(--zero)";
    return `<div class="person${p.qq===SELECTED?" active":""}" data-qq="${esc(p.qq)}">
      <span class="dot" style="background:${color}"></span>
      <span><div class="pname">${esc(p.name||p.qq)}</div>
      <div class="pmeta">${esc(s.label||"中")}·${esc(s.type_label||"")} ${(v>=0?"+":"")+v.toFixed(2)}</div></span></div>`;
  }).join("");
  box.querySelectorAll(".person").forEach(el=>el.addEventListener("click",()=>{SELECTED=el.dataset.qq;renderPeople();renderDetail();}));
}
function renderDetail(){
  const box=document.getElementById("detail"), p=(DATA.people||[]).find(x=>x.qq===SELECTED);
  if(!p){box.innerHTML=`<div class="empty">—</div>`;return;}
  const s=p.sentiment||{}, v=Number(s.score||0);
  const dims=p.dims||{};
  box.innerHTML=`
    <div class="big" style="font-size:20px">${esc(p.name||p.qq)}　${esc(s.label||"中")}·${esc(s.type_label||"")}</div>
    <div class="meta">情感 ${(v>=0?"+":"")+v.toFixed(2)}　·　趋势 ${esc(s.trend||"稳定")}　·　观察 ${Number(s.samples||0)} 天　·　累计 ${Number(p.message_count||0)} 条</div>
    <div style="margin-top:10px">${Object.keys(DIM_LABELS).map(k=>bar(DIM_LABELS[k],Number(dims[k]||0),true)).join("")}</div>
    ${p.summary?`<div class="meta" style="margin-top:8px">${esc(p.summary)}</div>`:""}`;
}
function scheduleRefresh(){
  const raw=Number((DATA.meta||{}).page_refresh_minutes||5);
  const mins=Math.max(1,Math.min(240,isFinite(raw)?raw:5));
  if(refreshTimer&&mins===REFRESH_MIN)return;
  REFRESH_MIN=mins; if(refreshTimer)clearInterval(refreshTimer);
  refreshTimer=setInterval(refresh,mins*60000);
}
async function refresh(){
  try{DATA=await fetchData()||{};render();}catch(e){
    document.getElementById("detail").innerHTML=`<div class="empty">加载失败：${esc(e.message||e)}</div>`;}
  scheduleRefresh();
}
refresh();
</script>
</body>
</html>
