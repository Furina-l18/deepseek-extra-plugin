name: astrbot_plugin_affect_core
display_name: 影响核心（激素·情绪·情感·能量）
desc: 四层闭环 + 人味三件套 + 桌面反向通道。激素驱动情绪与能量，情感按人独立并汇总成共享内分泌基线；另含风格约束（从自己发过的话学节奏、清 markdown）、自我修正（不确定时补一句）、自我学习（记住别人教的东西）；桌面端（DSH）双向联动默认关闭，需在配置里手动打开 `two_way_enabled`。能量门控只作用于 QQ 侧对话（低电切便宜模型），桌面侧不受能量影响。群聊按场合分级：被点名/私聊必接，其余按概率与静默时段决定，求安慰按情绪更换说法，不用固定模板。
help: /状态 四层总览；/心情 /激素 /能量；/情感 [@或QQ]；/情感列表；/记忆 看学到的；/风格 看说话统计；/安慰（管理员）；/情感刷新（管理员）
version: v1.6.13
author: Furina-l18
astrbot_version: ">=4.29.0,<5"







